server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 5 files x 10 MB (+ overhead). Keep >= MAX_FILES_PER_REQUEST * MAX_FILE_SIZE_MB
  client_max_body_size 55m;
  server_tokens off;

  # --- API + health are proxied so browser and API share ONE origin (cookie-safe, no CORS) ---
  location /api/ {
    proxy_pass http://api:5000;           # change host:port if the API runs elsewhere
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    include /etc/nginx/security-headers.conf;
  }
  location = /health {
    proxy_pass http://api:5000/health;
    access_log off;
    include /etc/nginx/security-headers.conf;
  }
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; access_log off; }

  # --- static SPA ---
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;           # SPA fallback
  }
}
